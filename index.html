<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bir Sorum Var ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 40px 25px;
  text-align: center;
  background: rgba(255,255,255,0.95);
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.heart {
  font-size: 75px;
  animation: beat 1s infinite;
}

h1 {
  color: #e91e63;
  font-size: 30px;
  margin: 15px 0;
}

p {
  color: #555;
  font-size: 18px;
  line-height: 1.5;
}

.buttons {
  position: relative;
  height: 90px;
  margin-top: 25px;
}

button {
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yes {
  background: #e91e63;
  color: white;
  margin-right: 10px;
}

#no {
  background: #ddd;
  color: #555;
  position: absolute;
}

#message {
  display: none;
  color: #e91e63;
  font-size: 23px;
  font-weight: bold;
  margin-top: 20px;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">❤️</div>

  <h1>Sana bir sorum var...</h1>

  <p>
    Belki biraz cesaret istiyor ama<br>
    yine de sormak istiyorum...
  </p>

  <h1>Benimle çıkar mısın? 💕</h1>

  <div class="buttons">
    <button id="yes">Evet ❤️</button>
    <button id="no">Hayır 🙈</button>
  </div>

  <div id="message">
    AAAAA! ❤️🥹<br><br>
    Dünyanın en güzel “Evet”ini aldım! 💕
  </div>

</div>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const message = document.getElementById("message");

yes.addEventListener("click", function() {
  message.style.display = "block";
  yes.style.display = "none";
  no.style.display = "none";
});

function moveNo() {
  const maxX = 180;
  const maxY = 60;

  const x = Math.random() * maxX - maxX / 2;
  const y = Math.random() * maxY - maxY / 2;

  no.style.transform = `translate(${x}px, ${y}px)`;
}

no.addEventListener("mouseover", moveNo);
no.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
});
</script>

</body>
</html>
